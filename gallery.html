<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery | kn.alters - MTG Card Alterations</title>

    <!-- FAVICON -->
    <link rel="shortcut icon" href="images/favicon.png">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background: linear-gradient(135deg, #23352b 0%, #34483d 50%, #687e72 100%);
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            color: #28322c; 
            letter-spacing: 0.01em;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden !important;
            scroll-behavior: smooth;
        }

        .main-layout {
            display: grid;
            grid-template-columns: minmax(320px, 360px) minmax(500px, 1fr);
            width: 100%;
            max-width: 1450px;
            margin: 0 auto;
            min-height: 100vh;
            box-sizing: border-box;
            gap: clamp(20px, 3vw, 50px);
            padding: 0 20px;
        }

        .sidebar-wrapper {
            padding: 40px 0;
            box-sizing: border-box;
            width: 100%;
        }

        .sticky-container {
            position: sticky;
            top: 40px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-card {
            background: #f2f0eb;
            padding: clamp(30px, 2.5vw, 40px) clamp(20px, 2vw, 35px);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #385445 0%, #83a883 50%, #385445 100%);
        }

        .site-logo-img {
            max-width: 230px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .link-item {
            display: block;
            background: #e9e6df;
            color: #23352b; 
            text-decoration: none;
            padding: 14px 20px;
            font-size: clamp(11px, 0.85vw, 12px);
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700; 
            border-radius: 14px;
            border: 1px solid rgba(56, 84, 69, 0.12);
            border-left: 4px solid #385445;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
            box-sizing: border-box;
            cursor: pointer;
        }

        .link-item:hover, .link-item.active {
            background: #385445;
            color: #ffffff;
            border-color: #385445;
            border-left-color: #81b29a;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .feed-container {
            padding: 40px 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 100%;
        }

        .info-block {
            background: #f2f0eb;
            border-radius: 24px;
            padding: clamp(24px, 3vw, 40px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            position: relative;
        }

        .gallery-header-banner {
            background: linear-gradient(135deg, #1f3328 0%, #2e4437 100%);
            color: #f2f0eb;
            border-radius: 18px;
            padding: 24px 28px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 6px 18px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .banner-info-group h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 6px 0;
            color: #ffffff;
        }

        .banner-info-group p {
            margin: 0;
            font-size: 13px;
            color: #a3b8ab;
        }

        .banner-counter-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #81b29a;
            white-space: nowrap;
        }

        .filter-bar-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(56, 84, 69, 0.1);
        }

        .filter-chip {
            background: #e4e1d7;
            border: 1px solid rgba(56, 84, 69, 0.15);
            color: #385445;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-chip:hover, .filter-chip.active {
            background: #385445;
            color: #ffffff;
            border-color: #385445;
            box-shadow: 0 3px 10px rgba(56, 84, 69, 0.2);
        }

        .full-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 30px 18px;
            width: 100%;
            box-sizing: border-box;
            padding-top: 15px;
        }

        .gallery-card-item {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            aspect-ratio: 180 / 252;
            margin-top: 10px;
            background: rgba(0,0,0,0.03);
            border-radius: 14px;
        }

        .gallery-card-item img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            border: 2px solid transparent;
        }

        .gallery-card-item:hover img {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 14px 28px rgba(0,0,0,0.22);
            border-color: rgba(255, 42, 109, 0.6);
        }

        .latest-badge-tag {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff2a6d 0%, #ff758c 100%);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #ffffff;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(255, 42, 109, 0.3);
            animation: pulseGlowMinimal 2.5s infinite ease-in-out;
            text-transform: uppercase;
            white-space: nowrap;
        }

        @keyframes pulseGlowMinimal {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 109, 0.5); }
            50% { box-shadow: 0 0 0 6px rgba(255, 42, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 109, 0); }
        }

        .post-date-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #6d7d74;
            margin-top: 35px;
            border-top: 1px solid rgba(56, 84, 69, 0.1);
            padding-top: 15px;
        }

        .floating-top-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: linear-gradient(135deg, #e07a5f 0%, #f4a261 100%);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 12px 20px;
            border-radius: 30px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 6px 20px rgba(224, 122, 95, 0.4);
            text-decoration: none;
            z-index: 9999;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .floating-top-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(224, 122, 95, 0.6);
        }

        .custom-lightbox {
            display: none;
            position: fixed;
            z-index: 999999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color
